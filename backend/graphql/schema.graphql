# Public portal schema: the query fields and types used by the GN page and the
# industry survey, copied verbatim from the main app's graphql/schema.graphql.
# Admin queries and all mutations are omitted (they require authentication).

scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

type Query {
    "Get GN by CCODE directly"
    gnByCcode(CCODE: String! @eq): GramaNiladhari @find

    "Get all active questions"
    questions: [Question!]!
        @field(resolver: "App\\GraphQL\\Queries\\QuestionQueries@questions")

    "Get subcategories by parent slug"
    categoryBySlug(slug: String!): Category @cache(maxAge: 3600)
        @field(resolver: "App\\GraphQL\\Queries\\CategoryQueries@categoryBySlug")

    "Get all descendants of a root slug as a flat searchable list with breadcrumbs"
    categoriesByRootSlug(rootSlug: String!, slugPrefix: String): [FlatCategory!]!
        @field(resolver: "App\\GraphQL\\Queries\\CategoryQueries@categoriesByRootSlug")

    gnByCoordinates(lat: Float!, lng: Float!): GramaNiladhari @field(resolver: "App\\GraphQL\\Queries\\GnByCoordinates") @cache(maxAge: 3600)

    "PDistricts"
    pDistricts: [PDistrict!]! @all @cache(maxAge: 3600)

    pDistrict(id: ID! @eq): PDistrict @find @cache(maxAge: 3600)
}

type Question {
    id: ID!
    category: Category @belongsTo
    section: String
    questionTextEn: String! @rename(attribute: "question_text_en")
    questionTextSi: String @rename(attribute: "question_text_si")
    questionTextTa: String @rename(attribute: "question_text_ta")
    explanationEn: String @rename(attribute: "explanation_en")
    explanationSi: String @rename(attribute: "explanation_si")
    explanationTa: String @rename(attribute: "explanation_ta")
    inputType: String! @rename(attribute: "input_type")
    isRepeater: Boolean! @rename(attribute: "is_repeater")
    sortOrder: Int! @rename(attribute: "sort_order")
    isActive: Boolean! @rename(attribute: "is_active")
    isStandard: Boolean! @rename(attribute: "is_standard")
    createdAt: DateTime! @rename(attribute: "created_at")
    updatedAt: DateTime @rename(attribute: "updated_at")
}

type FlatCategory {
    id: ID!
    slug: String!
    nameEn: String!
    nameSi: String!
    nameTa: String!
    parentId: ID
    breadcrumb: String!
    depth: Int!
}

type Category {
    id: ID!
    parent: Category
    children: [Category!]
    ancestors: [Category!]!
    questions: [Question!]
    slug: String!
    code: String
    nameEn: String! @rename(attribute: "name_en")
    nameSi: String! @rename(attribute: "name_si")
    nameTa: String @rename(attribute: "name_ta")
    descriptionEn: String @rename(attribute: "description_en")
    descriptionSi: String @rename(attribute: "description_si")
    descriptionTa: String @rename(attribute: "description_ta")
    imagePath: String @rename(attribute: "image_path")
    sortOrder: Int! @rename(attribute: "sort_order")
    progress: Float @field(resolver: "App\\GraphQL\\Queries\\CategoryQueries@progress")
    createdAt: DateTime! @rename(attribute: "created_at")
    updatedAt: DateTime @rename(attribute: "updated_at")
}

type PGn {
    id: ID!
    ccode: String @rename(attribute: "CCODE")
    gramaNiladhariId: ID @rename(attribute: "grama_niladhari_id")
    gnName: String @rename(attribute: "gn_name")
    populationBoth: Int @rename(attribute: "population_both")
    populationMale: Int @rename(attribute: "population_male")
    populationFemale: Int @rename(attribute: "population_female")
    age_0_14: Int
    age_15_59: Int
    age_60_64: Int
    age_65_above: Int
}

type GramaNiladhari {
    id: ID!
    provinceCode: String @rename(attribute: "province_code")
    PCCODE: String
    districtCode: String @rename(attribute: "district_code")
    DCCODE: String
    divisionalSecretariatCode: String @rename(attribute: "divisional_secretariat_code")
    DSCCODE: String
    code: String
    CCODE: String
    nameSi: String @rename(attribute: "name_si")
    nameEn: String @rename(attribute: "name_en")
    nameTa: String @rename(attribute: "name_ta")
    proEn: String @rename(attribute: "pro_en")
    proSi: String @rename(attribute: "pro_si")
    proTa: String @rename(attribute: "pro_ta")
    disEn: String @rename(attribute: "dis_en")
    disSi: String @rename(attribute: "dis_si")
    disTa: String @rename(attribute: "dis_ta")
    dsEn: String @rename(attribute: "ds_en")
    dsSi: String @rename(attribute: "ds_si")
    dsTa: String @rename(attribute: "ds_ta")
    police: Police @hasOne
    postOffice: PostOffice @belongsTo
    pGn: PGn @hasOne @cache(maxAge: 86400)
    pDistrict: PDistrict @belongsTo @cache(maxAge: 86400)
    gnEconomy: GnEconomy @hasOne
    housingOwnershipStatus: HousingOwnershipStatus @hasOne
    housingWallType: HousingWallType @hasOne
    housingUnitType: HousingUnitType @hasOne
    toiletFacility: ToiletFacility @hasOne
    drinkingWaterSource: DrinkingWaterSource @hasOne
    solidWasteDisposal: SolidWasteDisposal @hasOne
    roomsInHousingUnit: RoomsInHousingUnit @hasOne
    housingRoofType: HousingRoofType @hasOne
    religiousAffiliation: ReligiousAffiliation @hasOne
    householdHeadRelationship: HouseholdHeadRelationship @hasOne
    boundary: GnBoundary @field(resolver: "App\\GraphQL\\Queries\\GramaNiladhariQueries@boundary")
}

