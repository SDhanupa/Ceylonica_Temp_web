upstream backend_cluster {
    server portal-api:9000;  # public portal API (main app: backend:9000)
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # ── Security headers (industrial baseline) ──────────────────────────────
    # `always` so they are sent on error responses too. Inherited by the /api
    # location because it declares no add_header of its own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Geolocation is used by the survey/contribution flow, so allow it for self only.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    # Content Security Policy. connect-src/img-src stay permissive over https so
    # env-specific origins (Keycloak, OpenStreetMap tiles) keep working; script
    # execution, framing, plugins and <base> are locked down. Tighten
    # connect-src to the real Keycloak origin once the deploy domain is fixed.
    # frame-src must allow the Keycloak origin: keycloak-js check-sso loads the
    # auth server in a hidden iframe. Without it (falls back to default-src
    # 'self') the silent SSO check times out and users are sent back to login
    # on every page load.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    # HSTS — enable once served over HTTPS (harmless but pointless on plain http):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Allow larger file uploads (up to 60MB)
    client_max_body_size 60M;

    # Enable Gzip Compression for fast API responses
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json application/graphql-response+json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Caching below uses `expires` only (never add_header) so the security
    # headers above are still inherited by these locations.

    # Serve React Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app shell must revalidate so a deploy is picked up immediately.
    location = /index.html {
        expires -1;
    }

    # Vite emits content-hashed file names: safe to cache for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Proxy API/GraphQL requests to Laravel PHP-FPM backend
    location ~ ^/(api|graphql|sanctum) {
        fastcgi_pass backend_cluster;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120;
    }

    # Public images/fonts are not hashed: cache for a week. Declared after the
    # API location so /api/uploads/*.png keeps going to Laravel.
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
}
