# Celonica Public Portal — the GN page and industry survey, without login.
#
# The backend is the main app's backend code for these two pages with
# authentication removed. It runs with the main app's settings: the same
# PostgreSQL database and the same Redis (caches, OTP codes and rate limits
# are shared exactly as if it were another replica of the main backend).
#
# Start the main stack first (docker compose up -d in Celonica_DATAFORM-WEB),
# copy .env.example to .env and fill it in, then:  docker compose up -d --build
# Portal: http://localhost:3002

services:
  # ─── Frontend (React / Vite) ────────────────────────────────
  portal-web:
    build:
      context: ./frontend
    container_name: celonica-portal-frontend
    ports:
      - "${PORTAL_PORT:-3002}:80"
    depends_on:
      - portal-api
    restart: unless-stopped
    networks:
      - celonica_net

  # ─── Backend (Laravel / PHP-FPM) ────────────────────────────
  # Same environment as the main app's `backend` service.
  portal-api:
    build:
      context: ./backend
    container_name: celonica-portal-api
    restart: unless-stopped
    # Contains local-only secrets, including the TextWare password. This file
    # is ignored by Git and is never copied into source control.
    env_file:
      - ./backend/.env
    environment:
      - APP_NAME=Celonica Admin
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY:?set APP_KEY in .env}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:3002}
      - DB_CONNECTION=pgsql
      - DB_HOST=${DB_HOST:-celonica-web-postgres}
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-celonica_db}
      - DB_USERNAME=${DB_USERNAME:?set DB_USERNAME in .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL:-}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-}
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-https://ceystem.com}
      - CACHE_STORE=redis
      - CACHE_DRIVER=redis
      - REDIS_CLIENT=phpredis
      - SESSION_DRIVER=redis
      - REDIS_HOST=${REDIS_HOST:-celonica-web-redis}
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=sync
    volumes:
      # The main app's uploaded files, served by /api/uploads/{path}.
      - main_uploads:/var/www/public/uploads:ro
    networks:
      - celonica_net

volumes:
  main_uploads:
    name: ${MAIN_UPLOADS_VOLUME:-celonica-web-backend-uploads}
    external: true

networks:
  # The main stack's network: its PostgreSQL, Redis and Keycloak live here.
  celonica_net:
    name: ${MAIN_NETWORK:-celonica-web-network}
    external: true
